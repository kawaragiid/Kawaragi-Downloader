<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kawaragi Trigger</title>
  <style>
    body {
      width: 310px;
      margin: 0;
      padding: 16px;
      background-color: #1a1b26;
      color: #c0caf5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid #414868;
      padding-bottom: 10px;
    }
    .header img {
      width: 34px;
      height: 34px;
      border-radius: 6px;
    }
    .header h2 {
      margin: 0;
      font-size: 15px;
      color: #7aa2f7;
    }
    .header p {
      margin: 2px 0 0 0;
      font-size: 11px;
      color: #7982a9;
    }
    .status-box {
      background-color: #24283b;
      border: 1px solid #414868;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #f7768e;
      display: inline-block;
    }
    .dot.online {
      background-color: #9ece6a;
      box-shadow: 0 0 6px #9ece6a;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 8px;
      transition: opacity 0.15s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-primary {
      background-color: #9ece6a;
      color: #1a1b26;
    }
    .btn-secondary {
      background-color: #7aa2f7;
      color: #1a1b26;
    }
    .msg {
      font-size: 11px;
      color: #a9b1d6;
      text-align: center;
      min-height: 16px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="logo.png" alt="Logo">
    <div>
      <h2>Kawaragi Trigger v2.0</h2>
      <p>Bridge Anti-Blokir &amp; Cookies</p>
    </div>
  </div>

  <div class="status-box">
    <span id="statusDot" class="dot"></span>
    <span id="statusText">Memeriksa koneksi...</span>
  </div>

  <button id="btnSendTab" class="btn-primary">🚀 Kirim Tab Ini ke Kawaragi</button>
  <button id="btnSyncCookies" class="btn-secondary">🔑 Sinkronkan Cookies Sekarang</button>

  <div id="msgBox" class="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
